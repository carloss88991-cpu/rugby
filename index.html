<style>

}

/* ---------- calendario ---------- */
function makeSchedule(season, rng) {
  const tm = (d, k) => d * 4 + k;
  const PAT = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  const divRounds = [];
  for (let rep = 0; rep < 2; rep++) for (let p = 0; p < 3; p++) {
    const g = [];
    for (let d = 0; d < 8; d++) for (const [a, b] of PAT[p]) { const A = tm(d, a), B = tm(d, b); g.push(rep === 0 ? [A, B] : [B, A]); }
    divRounds.push(g);
  }
  const intra = PAT[season % 3]; const g0 = [];
  for (let c = 0; c < 2; c++) for (const [a, b] of intra) g0.push([c * 4 + a, c * 4 + b]);
  const g1 = [], g2 = [];

    const g = [];

      g.push(dxHome ? [tm(dx, m), tm(dy, j)] : [tm(dy, j), tm(dx, m)]);
    }
    crossRounds.push(g);
  }
  const divWeeks = [2, 5, 8, 12, 15, 17];
  const weeks = new Array(18); let di = 0, ci = 0;
  for (let w = 0; w < 18; w++) weeks[w] = divWeeks.includes(w) ? divRounds[di++] : crossRounds[ci++];
  // semanas de descanso: emparejamiento perfecto de equipos entre partidos de las semanas 4..13
  const elig = [];
  for (let w = 4; w <= 13; w++) weeks[w].forEach((g, gi) => elig.push([w, gi]));
  let chosen = null;
  for (let attempt = 0; attempt < 6000 && !chosen; attempt++) {
    const free = new Set(); for (let i = 0; i < 32; i++) free.add(i);
    const pick = []; const wc = new Array(18).fill(0);
    const cand = rng.shuffle(elig.slice());
    const cap = attempt < 3000 ? 2 : 4;
    for (const [w, gi] of cand) {

      if (free.has(a) && free.has(b) && wc[w] < cap) { free.delete(a); free.delete(b); pick.push([w, gi]); wc[w]++; }
    }
    if (free.size === 0) chosen = pick;
  }

  return weeks.map(g => g.filter(Boolean));
}

}

const pct = t => { const g = t.rec.w + t.rec.l + t.rec.t; return g ? (t.rec.w + t.rec.t * 0.5) / g : 0; };

    for (const id of order) { const p = byId.get(id); if (p && p.pos === pos && !p.inj) { pool.push(p); seen.add(p.id); } }
    const rest = R.players.filter(p => p.pos === pos && !p.inj && !seen.has(p.id)).sort((a, b) => b.ovr - a.ovr);

      pass: pas ? [pas[0].nm, (pas[1].pc || 0) + '/' + pas[1].pa + ' · ' + (pas[1].py || 0) + ' yd · ' + (pas[1].ptd || 0) + ' TD' + (pas[1].pint ? ' · ' + pas[1].pint + ' INT' : '')] : null,
      rush: rus.map(([p, g]) => [p.nm, g.ra + ' ac · ' + (g.ry || 0) + ' yd' + (g.rtd ? ' · ' + g.rtd + ' TD' : '')]),

      def: dfn.map(([p, g]) => [p.nm, (g.tkl || 0) + ' tck' + (g.sck ? ' · ' + g.sck + ' sack' : '') + (g.int ? ' · ' + g.int + ' INT' : '')])

/* ===== parte 3: liga, mercado, draft y temporadas ===== */
const keyOf = (s, w) => s + '_' + w;

function aiPlan(W, tid) {

function payrollFull(W, tid) { return r1(payroll(W, tid) + (W.teams[tid].dead || 0)); }
function capLeft(W, tid) { return r1(W.meta.cap - payrollFull(W, tid)); }

/* ---------- finanzas ---------- */

}

/* ---------- valores y mercado ---------- */
function playerValue(p) {

  const pot = p.age <= 25 ? Math.max(0, p.pot - p.ovr) * 10 : 0;

}
function keepScore(W, tid, p, rosterPlayers) {

  const rank = same.indexOf(p);

}
function trimRoster(W, tid, lines) {

    let worst = null, ws = 1e9;
    for (const p of R.players) { const k = keepScore(W, tid, p, R.players); if (k < ws) { ws = k; worst = p; } }
    cutPlayer(W, tid, worst, true); if (lines) lines.push(tname(W, tid) + ' recorta a ' + worst.nm + ' (' + worst.pos + ')');
  }
}
function cutPlayer(W, tid, p, toFA) {

  if (toFA) { p.tid = -1; p.exp = false; delete p.ask; p.sal = clamp(r1(marketSalary(p.pos, p.ovr, p.age) * 0.95), 0.8, 52); p.yrs = Math.min(p.yrs || 1, 3) || 1; W.fa.push(p); }

/* ---------- avance de semana de liga regular ---------- */
function simRegularWeek(W, ctx) {
  const m = W.meta, w = m.week; const key = keyOf(m.season, w);
  const humans = ctx.humans || new Set();
  const pre = []; for (const k in W.rosters) for (const p of W.rosters[k].players) if (p.inj > 0) pre.push(p);
  const games = []; const lines = [];
  for (const [h, a] of W.sched[w]) {
    const wantLog = humans.has(h) || humans.has(a) || ctx.logAll;
    const g = simGame(W, h, a, { seed: hashStr(m.seed + '|' + m.season + '|' + w + '|' + h + '|' + a), log: !!wantLog });
    applyResult(W, g, false);
    const rec = { h, a, hs: g.hs, as: g.as, ot: g.ot, qs: g.qs, box: g.box, tops: g.tops, inj: g.inj };
    if (g.log) rec.lg = { log: g.log, hdr: g.hdr };
    games.push(rec);
  }
  W.results[key] = { s: m.season, w, games, bye: byeTeams(W, w) };
  for (const p of pre) if (p.inj > 0) { p.inj--; if (W.teams[p.tid] && W.teams[p.tid].budget.fac >= 4 && p.inj > 0 && mkRng(hashStr(p.id + '|' + w)).chance(0.15)) p.inj--; }

  const gs = sorted[0]; if (gs) { const hw = gs.hs > gs.as; news(W, tname(W, hw ? gs.h : gs.a) + ' arrolla a ' + tname(W, hw ? gs.a : gs.h) + ' por ' + Math.max(gs.hs, gs.as) + '-' + Math.min(gs.hs, gs.as) + '.', hw ? gs.h : gs.a); }
  const ot = games.filter(g => g.ot)[0]; if (ot) news(W, 'Prórroga: ' + tname(W, ot.h) + ' ' + ot.hs + ' - ' + ot.as + ' ' + tname(W, ot.a) + '.', ot.h);
  for (const g of games) for (const i of g.inj) if (i.w >= 6 && (humans.has(i.tid) || W.rosters[i.tid].players.find(p => p.id === i.id && p.ovr >= 80))) news(W, tname(W, i.tid) + ': ' + i.nm + ' (' + i.pos + ') estará de baja ' + i.w + ' semanas.', i.tid);

/* ---------- playoffs ---------- */
function initPlayoffs(W) {
  const m = W.meta; m.phase = 'playoffs'; m.round = 1;
  const s0 = seeds(W, 0).map(t => t.id), s1 = seeds(W, 1).map(t => t.id);
  W.playoffs = { season: m.season, seeds: [s0, s1], alive: s0.concat(s1), elim: {}, champ: null, runner: null };
  for (const id of s0.concat(s1)) W.teams[id].apps++;
  news(W, 'Terminó la temporada regular: ya hay 14 equipos clasificados.', s0[0]);
}
function playoffMatchups(W) {
  const P = W.playoffs, r = W.meta.round; const out = [];
  const seedOf = tid => P.seeds[tid >> 4].indexOf(tid) + 1;
  if (r === 1) { for (const c of [0, 1]) { const s = P.seeds[c]; out.push([s[1], s[6]], [s[2], s[5]], [s[3], s[4]]); } }
  else if (r === 2 || r === 3) {

    }

}

  for (const [h, a] of ms) {

  const names = games.map(g => tname(W, g.hs > g.as ? g.h : g.a) + ' vence a ' + tname(W, g.hs > g.as ? g.a : g.h) + ' ' + Math.max(g.hs, g.as) + '-' + Math.min(g.hs, g.as));
  news(W, ROUND_ES[r] + ': ' + names[names.length - 1] + '.', games[games.length - 1].hs > games[games.length - 1].as ? games[games.length - 1].h : games[games.length - 1].a);

/* ---------- premios ---------- */
function playerScore(p) {
  const s = p.st; if (!s || !s.gp) return 0;
  return (s.py || 0) * 0.045 + (s.ptd || 0) * 4.5 - (s.pint || 0) * 2.5 + (s.ry || 0) * 0.11 + (s.rtd || 0) * 6 + (s.rey || 0) * 0.09 + (s.retd || 0) * 6 + (s.fum || 0) * -1.5;
}
function defScore(p) { const s = p.st; if (!s || !s.gp) return 0; return (s.sck || 0) * 5 + (s.int || 0) * 6 + (s.tkl || 0) * 0.45 + (s.ff || 0) * 3 + (s.pd || 0) * 1; }

  const best = (arr, f) => arr.reduce((b, p) => (!b || f(p) > f(b)) ? p : b, null);
  const win = p => W.teams[p.tid].rec.w;
  const mvp = best(all.filter(p => ['QB', 'RB', 'WR', 'TE'].includes(p.pos)), p => playerScore(p) + win(p) * 4);
  const dpoy = best(all.filter(p => ['DL', 'LB', 'CB', 'S'].includes(p.pos)), p => defScore(p) + win(p) * 0.5);
  const roy = best(all.filter(p => p.ex === 0 && p.st.gp), p => Math.max(playerScore(p), defScore(p) * 1.2));
  const f = (p, k) => p ? { id: p.id, nm: p.nm, pos: p.pos, tid: p.tid, k } : null;
  return { mvp: f(mvp, 'MVP'), dpoy: f(dpoy, 'Jugador defensivo'), roy: f(roy, 'Novato del año') };

/* ---------- progresión ---------- */
function progressPlayer(rng, p, coach) {
  const age = p.age; let mu;
  if (age <= 22) mu = 3.4; else if (age <= 24) mu = 2.3; else if (age <= 26) mu = 0.9; else if (age <= 28) mu = 0.0; else if (age <= 30) mu = -0.9; else if (age <= 32) mu = -2.0; else if (age <= 34) mu = -3.0; else mu = -4.2;

  if (age <= 25) mu += (p.pot - p.ovr) * 0.10;
  mu += ((coach || 3) - 3) * 0.3;
  p.at = p.at.map(x => clamp(Math.round(x + rng.norm(mu, 2.0)), 25, 99));
  p.ovr = calcOvr(p.at);
  p.pot = age <= 25 ? clamp(Math.max(p.ovr, Math.round(p.pot + rng.norm(0, 1.5))), p.ovr, 99) : p.ovr;
}
function genDraft(W, rng) {
  const counts = { QB: 20, RB: 30, WR: 44, TE: 20, OL: 48, DL: 46, LB: 32, CB: 34, S: 24, K: 5, P: 5 };
  const out = [];
  for (const pos of POS) for (let i = 0; i < counts[pos]; i++) {
    let ovr = clamp(Math.round(rng.norm(55, 8.5)), 38, 86); if (pos === 'K' || pos === 'P') ovr = clamp(Math.round(rng.norm(62, 9)), 45, 88);
    const p = mkPlayer(W, rng, pos, ovr, rng.int(21, 23), -2); p.ex = 0; p.pot = clamp(p.ovr + rng.int(3, 24), p.ovr, 97);
    p.sal = 0; p.yrs = 0; out.push(p);
  }
  out.sort((a, b) => (b.ovr * 0.5 + b.pot * 0.5) - (a.ovr * 0.5 + a.pot * 0.5));
  out.forEach((p, i) => p.rk = i + 1);

}

/* ---------- fin de temporada ---------- */
function endSeason(W, ctx) {
  const m = W.meta, P = W.playoffs; const rng = mkRng(hashStr(m.seed + '|end|' + m.season));
  const humans = (ctx && ctx.humans) || new Set();
  const champ = P.champ; W.teams[champ].titles++;
  const awards = computeAwards(W);
  // clasificación final y orden del draft

/* ---- calendario: lunes, jueves y sábado ---- */
const SLOT_DAYS = [1, 4, 6]; /* 0=domingo ... 1=lunes, 4=jueves, 6=sábado */

  return Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute, +p.second) - Math.floor(ts / 1000) * 1000;
}
function zonedEpoch(y, mo, d, H, M, tz) { const g = Date.UTC(y, mo, d, H, M); let o = tzOff(g, tz); let r = g - o; const o2 = tzOff(r, tz); if (o2 !== o) r = g - o2; return r; }

    const d = new Date(Date.UTC(base.getUTCFullYear(), base.getUTCMonth(), base.getUTCDate() + i));
    if (!SLOT_DAYS.includes(d.getUTCDay())) continue;
    const t = zonedEpoch(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), hm[0], hm[1], tz);
    if (t > after) return t;
  }

}

function nextWhen(ts) {
  if (!ts) return ''; const d = ts - Date.now();
  const when = new Date(ts).toLocaleString('es-ES', { weekday: 'long', hour: '2-digit', minute: '2-digit' });
  if (d <= 0) return 'ahora mismo (' + when + ')';
  const mins = Math.round(d / 60000);
  const rel = mins < 60 ? 'en ' + mins + ' min' : mins < 2880 ? 'en ' + Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min' : 'en ' + Math.round(mins / 1440) + ' días';
  return when + ' · ' + rel;
}

/* tras avanzar: fija el siguiente hueco. forced = jornada extra adelantada por el comisionado */
function bumpNext(m, forced) {
  if (m.auto === false) { return; }
  const now = Date.now();
  if (forced && m.nextAt && m.nextAt > now) return;
  const late = !m.nextAt || now - m.nextAt > 7 * 864e5; /* si la liga estuvo parada más de una semana, se salta lo perdido */
  m.nextAt = nextSlot(late ? now : m.nextAt, m.tz, m.hm);

/* avance automático: cualquier cliente conectado juega la jornada cuando llega la hora (lun/jue/sáb) */
async function autoAdvance() {
  if (OL.auto || !S.db || !SB) return;
  const c0 = OL.cache.core; if (!c0) return; const m0 = c0.meta;
  if (m0.auto === false || !m0.nextAt || Date.now() < m0.nextAt) return;
  if (Date.now() - OL.lastAdv < 6000 || Date.now() - OL.fail < 60000) return;
  OL.auto = true; const db = S.db; let held = false;
  try {
    const lk = await db.doc('lg/advlock').acquire({ holder: S.uid, ttlMs: 90000 }); if (!lk.acquired) return; held = true;
    const al = await db.doc('lg/lock').acquire({ holder: S.uid, ttlMs: 60000 }); if (!al.acquired) { OL.lastAdv = Date.now() - 3000; return; }
    const rows = await db.all(); const c = {};
    rows.forEach(x => { try { if (x && x.j) c[x.id] = JSON.parse(x.j); } catch (e) { } });
    if (!c.core) return; const m = c.core.meta; if (m.auto === false || !m.nextAt || Date.now() < m.nextAt) return;
    const W = buildWorld(c); if (!W) return;
    const prev = { week: m.week, phase: m.phase, season: m.season, round: m.round };
    const owners = (c.own && c.own.o) || {};
    if (S.mode === 'online') { S.busy = true; render(); }
    const r = GD.advance(W, { humans: new Set(Object.keys(owners).map(Number)) });
    bumpNext(W.meta, false);
    await persistWorld(W, r, prev, Object.keys(c));
    OL.lastAdv = Date.now();
  } catch (e) { OL.fail = Date.now(); console.error('Avance automático falló', e); toast('El avance automático falló: ' + (e.message || e.code || e), 1); }
  finally { if (held) { db.doc('lg/advlock').release(); db.doc('lg/lock').release(); } OL.auto = false; if (S.busy && S.mode === 'online') { S.busy = false; render(); } }
}

  if (c === 'tw') { S.f.tw = v === '' ? null : +v; S.f.give = []; S.f.get = []; } else S.f[c] = v; render();
});
document.addEventListener('input', e => {
  if (e.target.id === 'tix') { const x = $('#tixv'); if (x) x.textContent = e.target.value; }
  if (e.target.id === 'chatin') S.chatDraft = e.target.value;
  if (e.target.id === 'pname') S.myName = e.target.value;
  if (e.target.id === 'jcode') S.jcode = e.target.value;
});
document.addEventListener('submit', e => { if (e.target.id === 'chatform') { e.preventDefault(); const i = $('#chatin'); sendChat(i.value); i.value = ''; S.chatDraft = ''; } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (MATCH) stopMatch(); else if (S.modal) { S.modal = null; render(); } } });

(async function boot() {
  try { const th = localStorage.getItem('gd.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) { }
  const ov = document.createElement('div'); ov.id = 'ov'; document.body.appendChild(ov);
  render();
  if (!fbConfigured()) { S.sync = 'sin configurar'; S.authReady = true; render(); return; }
  try {
    sbInit(); await authInit(); await loadProfile();
    let last = ''; try { last = localStorage.getItem('gd.lastLeague') || ''; } catch (e) { }
    const q = urlLeague() || last;
    S.authReady = true; render();
    if (q) await connectLeague(q, !urlLeague());
  } catch (e) { console.error(e); S.sync = 'error'; toast(/anonymous/i.test(e.message || '') ? 'Activa «Allow anonymous sign-ins» en Supabase (Authentication).' : 'Error de Supabase: ' + (e.message || e.code), 1); }
  S.authReady = true; render();
  setInterval(() => { calcPeers(); updateCountdowns(); autoAdvance(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { touchMember(); if (S.db) loadLg(false).catch(() => { }); autoAdvance(); } });
})();
</script>
